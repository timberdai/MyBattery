name: MyBattery

on:
  push:
    branches: [main]
    tags: ['mybattery-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test battery parsing and read-only sensors
        run: swift test
      - name: Check scripts and resources
        run: |
          bash -n scripts/*.sh
          plutil -lint Resources/Info.plist
          git diff --check
      - name: Build archive
        env:
          MYBATTERY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/mybattery-v') && '1' || '0' }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyBattery-arm64
          path: |
            build/MyBattery-*.dmg
            build/MyBattery-*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/mybattery-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MyBattery-arm64
          path: artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "mybattery-v$VERSION"
          awk '/^## \[/{if (started) exit; started=1; next} started && /^## /{exit} started {print}' CHANGELOG.md > release-notes.md
          printf '\n## Download / 下载\n\nApple Silicon · macOS 13+\n\nOpen the DMG and drag MyBattery.app to Applications.\n打开 DMG，将 MyBattery.app 拖入 Applications。\n\nSource code (zip) and Source code (tar.gz) are provided automatically by GitHub.\n\n## SHA256\n\n```text\n' >> release-notes.md
          cat artifacts/*.sha256 >> release-notes.md
          printf '```\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg --verify-tag --title "v$VERSION" --notes-file release-notes.md
